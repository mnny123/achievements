<title>Achievement Leaderboard</title>
<style>
  /* ---------- tokens: white-dominant, single light theme ----------
     The design commits to one bright look: white ground, white cards
     separated by hairlines, ink-black as the only strong accent. */
  :root {
    color-scheme: light;
    --bg: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #F7F7F9;
    --surface-3: #FCFCFD;
    --ink: #111114;
    --muted: #71717A;
    --line: #E7E7EC;
    --line-strong: #D6D6DE;
    --accent: #111114;
    --accent-ink: #FFFFFF;
    --accent-soft: #F2F2F5;
    --chip-bg: #F1F1F4;
    --chip-ink: #111114;
    --good: #17805A;
    --good-ink: #FFFFFF;
    --danger: #B93A2E;
    --danger-soft: #FBEDEB;
    --warn-bg: #FBF4E2;
    --warn-text: #7A5D18;
    --shadow: 0 1px 2px rgba(17, 17, 20, 0.04);
    --shadow-lift: 0 1px 2px rgba(17, 17, 20, 0.04), 0 10px 30px rgba(17, 17, 20, 0.06);
  }

  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }

  .shell { max-width: 520px; margin: 0 auto; padding: 0 14px 40px; }
  .center-screen {
    min-height: 70vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
  }

  /* ---------- type ---------- */
  .h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; margin: 2px 0 10px; text-wrap: balance; }
  .h3 { font-size: 15px; font-weight: 650; margin: 18px 0 8px; }
  .eyebrow {
    display: block; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted);
  }
  .muted { color: var(--muted); margin: 0 0 12px; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .hint-error { color: var(--danger); }
  .optional { font-weight: 400; color: var(--muted); }

  /* ---------- header ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 2px 10px; margin-bottom: 8px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .topbar-avatar { background: none; border: none; padding: 0; cursor: pointer; border-radius: 50%; }
  .btn-refresh {
    width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer;
    font-size: 20px; line-height: 1; display: grid; place-items: center; color: var(--muted);
  }
  .refresh-icon { display: inline-block; }
  .spinning .refresh-icon { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinning .refresh-icon { animation: none; }
  }

  /* ---------- cards & banners ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 20px 18px; margin: 14px 0;
  }
  .btn-ghost { background: none; border-color: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); }
  .banner {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 14px;
  }
  .banner-warn { background: var(--warn-bg); color: var(--warn-text); }
  .banner-error { background: var(--danger-soft); color: var(--danger); }
  .banner-x { background: none; border: none; font-size: 20px; line-height: 1; cursor: pointer; padding: 0 2px; }

  .status-line {
    background: var(--surface); border: 1px solid var(--line); color: var(--muted);
    border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 14px;
  }
  .status-creator { border: 1px dashed var(--muted); color: var(--ink); }

  /* ---------- buttons & fields ---------- */
  .btn {
    border-radius: 11px; border: 1px solid var(--line); background: var(--surface);
    padding: 12px 18px; min-height: 48px; font-weight: 600; cursor: pointer;
  }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: var(--surface-2); }
  .btn-block { display: block; width: 100%; margin-top: 16px; }
  .btn-mini { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 9px; }
  .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn-approve { background: var(--good); border-color: var(--good); color: var(--good-ink); }
  .btn:focus-visible, .seg-btn:focus-visible, .board-row:focus-visible, .log-row:focus-visible,
  .photo-target:focus-visible, .link-btn:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }
  .link-btn {
    background: none; border: none; padding: 6px 4px; cursor: pointer;
    font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: underline;
  }
  .link-btn-center { display: block; margin: 12px auto 0; }
  .hint-good { color: var(--good); }

  .field { display: block; margin: 14px 0; }
  .field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .input {
    width: 100%; min-height: 48px; padding: 10px 14px; font: inherit;
    border-radius: 11px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink);
  }
  .input::placeholder { color: var(--muted); opacity: 0.6; }
  .input:focus { outline: 2px solid var(--ink); outline-offset: 0; border-color: var(--ink); }
  .input-code {
    font-size: 21px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .field-points .input { max-width: 140px; font-variant-numeric: tabular-nums; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .form-actions-split { justify-content: space-between; margin-top: 16px; }
  .form-actions-split .btn-primary { flex: 1; margin-left: 10px; }

  .privacy-note {
    background: var(--surface-2); border-radius: 12px;
    padding: 12px 14px; font-size: 13px; color: var(--muted); margin: 16px 0 0; line-height: 1.5;
  }
  .privacy-note strong { color: var(--ink); }

  .contact-line {
    display: flex; flex-direction: column; gap: 2px;
    background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin: 14px 0 0;
  }
  .contact-line .field-label { margin: 0; }
  .contact-value { font-weight: 600; overflow-wrap: anywhere; }

  /* ---------- avatars & points ---------- */
  .avatar { border-radius: 50%; object-fit: cover; flex-shrink: 0; display: block; }
  .avatar-fallback { display: grid; place-items: center; color: #fff; font-weight: 700; }
  .pts {
    display: inline-block; background: var(--chip-bg); color: var(--chip-ink);
    font-weight: 700; font-variant-numeric: tabular-nums;
    border-radius: 999px; padding: 3px 10px; font-size: 13.5px; white-space: nowrap;
  }
  .pts-big { font-size: 15px; padding: 5px 13px; background: var(--ink); color: var(--surface); }
  .pts-unit { font-size: 0.72em; font-weight: 600; opacity: 0.7; }
  .count-chip {
    display: inline-block; background: var(--chip-bg); color: var(--chip-ink);
    font-size: 13px; font-weight: 600; border-radius: 999px; padding: 2px 10px;
    vertical-align: 2px; margin-left: 4px; font-variant-numeric: tabular-nums;
  }

  /* ---------- profile form ---------- */
  .profile-fields { margin: 6px 0 2px; }
  .photo-stack { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 10px 0 4px; }
  .photo-target {
    position: relative; background: none; border: none; padding: 0; cursor: pointer; border-radius: 50%;
  }
  .photo-target .avatar { box-shadow: 0 0 0 1px var(--line), var(--shadow); }
  .photo-fab {
    position: absolute; right: -2px; bottom: -2px;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    box-shadow: 0 0 0 2.5px var(--surface);
  }
  .photo-hint { margin: 4px 0 0; text-align: center; max-width: 320px; }

  /* ---------- achievement lists ---------- */
  .ach-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .ach-row {
    display: flex; gap: 12px; justify-content: space-between; align-items: flex-start;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .ach-row-editing { display: block; }
  .ach-main { min-width: 0; }
  .ach-title { font-weight: 650; }
  .ach-desc { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .ach-by { font-size: 12px; color: var(--muted); margin-top: 6px; font-style: italic; }
  .ach-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .ach-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .ach-row-pending { border-style: dashed; background: var(--surface-2); }
  .pending-badge {
    display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; font-style: normal;
    background: var(--warn-bg); color: var(--warn-text); border-radius: 6px; padding: 2px 7px;
  }

  .log-row {
    width: 100%; display: flex; gap: 12px; justify-content: space-between; align-items: center;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; min-height: 64px; cursor: pointer; text-align: left;
  }
  .log-row:active { background: var(--accent-soft); border-color: var(--ink); }
  .undo-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  /* ---------- leaderboard ---------- */
  .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .board-row {
    width: 100%; display: flex; align-items: center; gap: 12px;
    background: var(--surface-3); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 14px; min-height: 64px; cursor: pointer; text-align: left;
  }
  .board-row-me { border-color: var(--ink); background: var(--accent-soft); }
  .board-rank {
    width: 30px; height: 30px; display: grid; place-items: center;
    font-weight: 700; font-size: 15px; color: var(--muted);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .board-rank-top { background: var(--ink); color: var(--surface); border-radius: 50%; }
  .board-name {
    flex: 1; min-width: 0; font-weight: 650;
    display: flex; flex-direction: column; gap: 1px;
  }
  .board-name-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .board-name-text { min-width: 64px; }
  .board-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .board-sub { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .me-tag { font-weight: 400; color: var(--muted); font-size: 0.9em; }
  .contrib-tag {
    display: inline-block; flex-shrink: 0; font-size: 11px; font-weight: 700;
    font-variant-numeric: tabular-nums; background: var(--chip-bg); color: var(--chip-ink);
    border-radius: 6px; padding: 2px 6px;
  }
  .creator-tag {
    display: inline-block; flex-shrink: 0; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    background: var(--chip-bg); color: var(--muted);
    border-radius: 5px; padding: 2px 6px; vertical-align: 2px;
  }

  /* ---------- summary / stats ---------- */
  .summary-row { display: flex; gap: 10px; margin: 14px 0; }
  .summary-stat {
    flex: 1; background: var(--surface-2); border-radius: 12px; padding: 14px 12px; text-align: center;
  }
  .summary-num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .summary-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
  .stats-head { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 8px 0 4px; }
  .stats-head .avatar { box-shadow: 0 0 0 1px var(--line), var(--shadow); }
  .stats-name { margin: 4px 0 0; }
  .stats-meta {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center;
    color: var(--muted); font-size: 13.5px;
  }
  .stats-meta-dot { opacity: 0.5; }
  .breakdown { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .breakdown-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border-radius: 11px; padding: 10px 12px;
  }
  .breakdown-title { flex: 1; min-width: 0; font-weight: 600; }
  .breakdown-count { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }

  .confirm-box { background: var(--danger-soft); border-radius: 12px; padding: 14px; margin-top: 12px; }
  .confirm-box p { margin: 0 0 10px; }
  .card-finalize { border-style: dashed; }

  /* ---------- feed ---------- */
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .feed-row { display: flex; align-items: center; gap: 12px; }
  .feed-main { flex: 1; min-width: 0; font-size: 14.5px; }
  .feed-time { font-size: 12.5px; color: var(--muted); }
  .nth-tag {
    display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700;
    background: var(--chip-bg); color: var(--chip-ink); border-radius: 6px; padding: 1px 6px;
  }
  .adj-tag {
    display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700;
    background: var(--warn-bg); color: var(--warn-text); border-radius: 6px; padding: 1px 6px;
    white-space: nowrap;
  }
  .adjustable-tag {
    display: inline-block; margin-top: 5px; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    background: var(--warn-bg); color: var(--warn-text); border-radius: 6px; padding: 2px 7px;
  }
  .field-check {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 13.5px; color: var(--muted); cursor: pointer;
  }
  .field-check strong { color: var(--ink); }
  .field-check input {
    width: 20px; height: 20px; margin-top: 1px; flex-shrink: 0; accent-color: var(--ink);
  }
  .adj-panel {
    width: 100%; background: var(--surface-2); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .adj-row { display: flex; gap: 8px; align-items: stretch; }
  .adj-row .input { max-width: 130px; }
  .adj-row .btn-primary { flex: 1; white-space: nowrap; }
  .feed-empty {
    min-height: 300px; display: grid; place-items: center; text-align: center;
    background: var(--chip-bg); border: 1.5px dashed var(--line-strong);
    border-radius: 12px; padding: 28px 20px; color: var(--muted);
  }
  .feed-empty-title { font-weight: 700; font-size: 15.5px; color: var(--ink); margin-bottom: 4px; }
  .tabs-row { display: flex; gap: 8px; align-items: stretch; margin: 14px 0 0; }
  .tabs-row .segmented { flex: 1; margin: 0; }
  .contrib-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; border-radius: 13px; padding: 6px 14px; min-width: 88px;
  }
  .contrib-btn-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--muted);
  }
  .contrib-btn-amt { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .contrib-input { max-width: 160px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pool-card { text-align: center; }
  .pool-num {
    font-size: 42px; font-weight: 800; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; margin: 6px 0 2px;
  }
  .pool-sub { color: var(--muted); font-size: 13.5px; margin: 0; }
  .feed-empty p { margin: 0; font-size: 14px; }
  .side-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .side-head .h2 { margin-bottom: 6px; }
  .notify-on { margin: 0; white-space: nowrap; }

  /* ---------- two-column desktop layout: game left, live feed right ---------- */
  .columns { display: block; }
  .side-feed { display: none; }
  @media (min-width: 960px) {
    .shell-wide { max-width: 966px; }
    .shell-wide .columns {
      display: grid; grid-template-columns: minmax(0, 560px) 350px;
      gap: 28px; align-items: start;
    }
    .shell-wide .side-feed {
      display: block; position: sticky; top: 84px;
      max-height: calc(100vh - 104px); overflow-y: auto;
    }
    .shell-wide .feed-inline { display: none; }
  }

  /* ---------- top tabs ---------- */
  .segmented {
    display: flex; gap: 4px; margin: 14px 0 0;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 13px; padding: 4px;
  }
  .seg-btn {
    flex: 1; min-height: 46px; border: none; background: none; cursor: pointer;
    font-size: 14.5px; font-weight: 600; color: var(--muted); border-radius: 10px;
  }
  .seg-btn-active { background: var(--accent); color: var(--accent-ink); }

  /* ---------- checklist ---------- */
  .check {
    min-width: 27px; height: 27px; padding: 0 4px;
    border: 2px solid var(--line-strong); border-radius: 8px;
    display: grid; place-items: center; flex-shrink: 0; background: var(--surface);
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .check-count { font-size: 12.5px; font-weight: 700; letter-spacing: -0.02em; }
  .log-item { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .log-item .log-row { flex: 1; min-width: 0; }
  .btn-minus {
    width: 50px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); font-size: 24px; color: var(--muted);
    cursor: pointer; flex-shrink: 0;
  }
  .btn-minus:active { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
  .check-on { background: var(--ink); border-color: var(--ink); color: var(--surface); }
  .log-row-done { background: var(--surface-2); }
  .summary-of { font-size: 0.6em; font-weight: 600; color: var(--muted); }

  /* ---------- sheet & toast ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 40; background: rgba(17, 17, 20, 0.35);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    position: relative; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto;
    background: var(--surface); border-radius: 18px 18px 0 0; padding: 20px 16px 30px;
    box-shadow: var(--shadow-lift);
    animation: sheet-up 0.22s ease-out;
  }
  @keyframes sheet-up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet-close {
    position: absolute; top: 12px; right: 14px; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); font-size: 20px; cursor: pointer; color: var(--muted);
  }
  .sheet .card { box-shadow: none; }
  .sheet main { margin-top: 8px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 50;
    display: flex; align-items: center; gap: 14px;
    background: var(--ink); color: var(--bg);
    border-radius: 999px; padding: 12px 20px; font-weight: 600; font-size: 14px;
    box-shadow: var(--shadow-lift); max-width: calc(100vw - 32px);
  }
  .toast-undo {
    background: none; border: none; color: inherit; font-weight: 700;
    text-decoration: underline; cursor: pointer; padding: 4px;
  }

  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--ink);
    animation: spin 0.8s linear infinite;
  }
  .ach-form { text-align: left; }

  /* ---------- title page ---------- */
  .title-page { padding: 28px 2px 8px; }
  .title-hero { padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .title-name {
    font-size: clamp(38px, 12vw, 52px); line-height: 1.02; font-weight: 800;
    letter-spacing: -0.035em; margin: 8px 0 0;
  }
  .title-sub { color: var(--muted); font-size: 15.5px; margin: 14px 0 0; max-width: 34ch; }
  .rules { list-style: none; margin: 0; padding: 0; }
  .rule {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .rule-num {
    flex-shrink: 0; width: 27px; height: 27px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px;
  }
  .rule-title { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .rule-body { color: var(--muted); font-size: 14.5px; margin: 4px 0 0; }
  .title-page .btn-block { margin-top: 26px; margin-bottom: 8px; }
</style>
<div id="root"></div>
